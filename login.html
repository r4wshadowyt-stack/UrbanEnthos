<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Sign in to your UrbanEthos account to explore personalized gifts and handcrafted creations.">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Login | UrbanEthos</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-showcase">
            <div class="showcase-content">

                <a href="index.html" class="auth-logo">
                    <img src="image/logo1.jpg" alt="UrbanEthos logo">
                </a>

                <span class="showcase-tag">
                    Welcome Back
                </span>

                <h1>
                    Crafted With Care,<br>
                    Designed For You.
                </h1>

                <p>
                    Sign in to your UrbanEthos account and continue
                    discovering personalized gifts and handcrafted
                    creations.
                </p>

            </div>
        </section>

        <section class="auth-box" aria-labelledby="loginHeading">

            <header class="auth-header">
                <span class="small-title">URBANETHOS</span>

                <h2 id="loginHeading">Welcome Back</h2>

                <p>Sign in to your account</p>
            </header>

            <form id="loginForm" class="auth-form">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="Enter your email"
                            autocomplete="username" maxlength="254" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">Password</label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password"
                            aria-controls="password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="remember-row">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="auth-button">
                    <span>Sign In</span>
                    <span class="button-arrow" aria-hidden="true">
                        →
                    </span>
                </button>

                <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>

            </form>

            <div class="register-link">
                <p>Don't have an account?</p>
                <a href="register.html" id="createAccountLink">
                    Create Account
                </a>
            </div>

            <a href="index.html" class="back-home">
                ← Back to UrbanEthos
            </a>

        </section>

    </main>

    <script src="auth.js" defer></script>

</body>

</html>
